name: trace

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trace}
      POSTGRES_DB: ${POSTGRES_DB:-trace}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trace} -d ${POSTGRES_DB:-trace}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    # The Qdrant image ships neither curl nor wget, so the probe opens a raw
    # TCP socket through bash and reads the status line itself.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          head -n 1 <&3 | grep -q "200"'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ml:
    build:
      context: ./services/ml
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ML_HOST: 0.0.0.0
      ML_PORT: 8000
      ML_LOG_LEVEL: ${ML_LOG_LEVEL:-info}
      UPLOAD_DIR: /data/uploads
      HF_HOME: /models/hf
      FASTEMBED_CACHE_PATH: /models/fastembed
      TORCH_HOME: /models/torch
      OMP_NUM_THREADS: ${ML_OMP_NUM_THREADS:-4}
      ML_THREADPOOL_WORKERS: ${ML_THREADPOOL_WORKERS:-2}
      TEXT_EMBEDDING_MODEL: ${TEXT_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      SPARSE_EMBEDDING_MODEL: ${SPARSE_EMBEDDING_MODEL:-Qdrant/bm25}
      CLIP_MODEL: ${CLIP_MODEL:-ViT-B-32}
      CLIP_PRETRAINED: ${CLIP_PRETRAINED:-laion2b_s34b_b79k}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      PDF_OCR_CHAR_THRESHOLD: ${PDF_OCR_CHAR_THRESHOLD:-40}
      PDF_OCR_DPI: ${PDF_OCR_DPI:-200}
      VIDEO_KEYFRAME_INTERVAL_SEC: ${VIDEO_KEYFRAME_INTERVAL_SEC:-30}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CAPTION_MODEL: ${GEMINI_CAPTION_MODEL:-gemini-3.8-flash}
      GEMINI_FILE_API_FALLBACK: ${GEMINI_FILE_API_FALLBACK:-true}
    ports:
      - "${ML_PORT:-8000}:8000"
    volumes:
      - uploads:/data/uploads
      - ml-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  ollama:
    image: ollama/ollama:0.12.3
    # Opt-in: `docker compose --profile local-llm up`. The image and weights are
    # a multi-GB download, and the stack is fully functional without it.
    profiles: ["local-llm"]
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # The bind mount is virtiofs on macOS and Windows, which does not deliver
      # inotify events, so the watcher has to poll or it silently never reloads.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "400"
      API_HOST: 0.0.0.0
      API_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-trace}:${POSTGRES_PASSWORD:-trace}@postgres:5432/${POSTGRES_DB:-trace}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-chunks}
      ML_SERVICE_URL: http://ml:8000
      UPLOAD_DIR: /data/uploads
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-536870912}
      MAX_URL_BYTES: ${MAX_URL_BYTES:-2097152}
      ALLOW_PRIVATE_URLS: ${ALLOW_PRIVATE_URLS:-false}
      MAILBOX_POLL_SECONDS: ${MAILBOX_POLL_SECONDS:-300}
      MAILBOX_BATCH_SIZE: ${MAILBOX_BATCH_SIZE:-200}
      MAILBOX_MAX_ATTACHMENT_BYTES: ${MAILBOX_MAX_ATTACHMENT_BYTES:-26214400}
      ALLOW_PRIVATE_MAILBOX_HOSTS: ${ALLOW_PRIVATE_MAILBOX_HOSTS:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GROQ_FAST_MODEL: ${GROQ_FAST_MODEL:-llama-3.1-8b-instant}
      GROQ_RPM: ${GROQ_RPM:-28}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_FAST_MODEL: ${GEMINI_FAST_MODEL:-gemini-3.1-flash-lite}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-none}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      OLLAMA_FAST_MODEL: ${OLLAMA_FAST_MODEL:-qwen3:1.7b}
      LLM_FALLBACK_COOLDOWN_MINUTES: ${LLM_FALLBACK_COOLDOWN_MINUTES:-60}
      LLM_RPM: ${LLM_RPM:-5}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-4}
      AGENT_MAX_ITERATIONS: ${AGENT_MAX_ITERATIONS:-3}
      SUFFICIENCY_MIN_RELEVANT_CHUNKS: ${SUFFICIENCY_MIN_RELEVANT_CHUNKS:-2}
      SUFFICIENCY_MIN_SCORE: ${SUFFICIENCY_MIN_SCORE:-0.55}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-12}
      RETRIEVAL_PREFETCH_K: ${RETRIEVAL_PREFETCH_K:-40}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-duckduckgo}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      RUN_MIGRATIONS_ON_BOOT: ${RUN_MIGRATIONS_ON_BOOT:-true}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/contracts:/app/packages/contracts
      - ./sample-corpus:/app/sample-corpus:ro
      # Writable: the eval runner reads datasets from here and writes its
      # markdown report back, so a run leaves an artefact on the host.
      - ./eval:/app/eval
      - uploads:/data/uploads
      # Anonymous volumes stop the host bind mounts above from shadowing what
      # the image build produced: installed dependencies, and the compiled
      # contracts the api imports. Without the dist entry a fresh clone would
      # have to run `pnpm build` on the host before compose could work.
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/contracts/node_modules
      - /app/packages/contracts/dist
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ml:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    restart: unless-stopped
    command: ["pnpm", "--filter", "@trace/api", "dev:worker"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "400"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-trace}:${POSTGRES_PASSWORD:-trace}@postgres:5432/${POSTGRES_DB:-trace}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-chunks}
      ML_SERVICE_URL: http://ml:8000
      UPLOAD_DIR: /data/uploads
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      # env.ts validates the whole LLM block wherever it loads, and it defaults
      # LLM_PROVIDER to groq. Passing only the Gemini keys here left the worker
      # asking for a Groq key nobody had set, so it threw on boot and every
      # upload sat in the queue with nothing to drain it. The worker gets the
      # same provider block the api does.
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_FAST_MODEL: ${GEMINI_FAST_MODEL:-gemini-3.1-flash-lite}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GROQ_FAST_MODEL: ${GROQ_FAST_MODEL:-llama-3.1-8b-instant}
      GROQ_RPM: ${GROQ_RPM:-28}
      CHUNK_SIZE_CHARS: ${CHUNK_SIZE_CHARS:-800}
      CHUNK_OVERLAP_CHARS: ${CHUNK_OVERLAP_CHARS:-150}
      INGEST_CONCURRENCY: ${INGEST_CONCURRENCY:-2}
      MAILBOX_POLL_SECONDS: ${MAILBOX_POLL_SECONDS:-300}
      MAILBOX_BATCH_SIZE: ${MAILBOX_BATCH_SIZE:-200}
      MAILBOX_MAX_ATTACHMENT_BYTES: ${MAILBOX_MAX_ATTACHMENT_BYTES:-26214400}
      ALLOW_PRIVATE_MAILBOX_HOSTS: ${ALLOW_PRIVATE_MAILBOX_HOSTS:-false}
      # Only the api container owns the schema; a worker racing it on boot
      # would deadlock on the migration advisory lock.
      RUN_MIGRATIONS_ON_BOOT: "false"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/contracts:/app/packages/contracts
      - uploads:/data/uploads
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/contracts/node_modules
      - /app/packages/contracts/dist
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/contracts:/app/packages/contracts
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/contracts/node_modules
      - /app/packages/contracts/dist
    depends_on:
      api:
        condition: service_started

volumes:
  ollama-models:
  postgres-data:
  redis-data:
  qdrant-data:
  ml-models:
  uploads:
